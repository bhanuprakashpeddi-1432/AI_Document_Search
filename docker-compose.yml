version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: hackrx-postgres
    environment:
      POSTGRES_DB: hackrx
      POSTGRES_USER: hackrx_user
      POSTGRES_PASSWORD: hackrx_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackrx_user -d hackrx"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - hackrx-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackrx-backend
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_ENV=${PINECONE_ENV}
      - PINECONE_INDEX=${PINECONE_INDEX:-hackrx-index}
      - POSTGRES_URL=postgresql://hackrx_user:hackrx_password@postgres:5432/hackrx
      - BEARER_TOKEN=${BEARER_TOKEN:-hackrx-secure-token}
      - DEBUG=false
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hackrx-network
    restart: unless-stopped

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackrx-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_API_TOKEN=${BEARER_TOKEN:-hackrx-secure-token}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - hackrx-network
    restart: unless-stopped

  # Redis for caching (optional enhancement)
  redis:
    image: redis:7-alpine
    container_name: hackrx-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - hackrx-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  hackrx-network:
    driver: bridge
